[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soulsync-tg-bot"
version = "0.1.0"
description = "An allowlisted Telegram sidecar for SoulSync playlists"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot==22.8", "httpx>=0.27,<0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.26", "pytest-cov", "ruff", "mypy", "build"]

[project.scripts]
soulsync-tg-bot = "soulsync_tg_bot.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
